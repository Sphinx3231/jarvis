name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CalDAV test server (Radicale)
        run: pip install radicale
      - name: Install OCR (Computer Access tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - name: Install Playwright for the browser tests
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_SCREENSHOTS: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results
          if-no-files-found: ignore
