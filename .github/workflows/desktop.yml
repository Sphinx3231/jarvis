name: Desktop app

# Builds the installers on each operating system and launches the packaged app in a
# smoke-test mode that checks the service starts and the UI loads.
on:
  push:
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'web/**'
      - 'assets/build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npm run dist

      # Jarvis runs on Roamies: first check it locks itself without Roamies, then that it starts
      # with a stand-in Roamies (JARVIS_ROAMIES_PATH points the detection at it).
      - name: Stand-in Roamies install
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/Roamies.app" "$RUNNER_TEMP/gg"
      - name: Smoke test, without Roamies (locked) (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a release/linux-unpacked/jarvis --no-sandbox
        env:
          JARVIS_SMOKE_TEST: '1'
          JARVIS_SMOKE_EXPECT: locked
          JARVIS_BRAIN: roamies  # the Roamies brain without Roamies installed → the lock screen
          JARVIS_ROAMIES_PATH: ${{ runner.temp }}/no-roamies/Roamies.app
          JARVIS_GG_DIR: ${{ runner.temp }}/gg
          JARVIS_DATA_DIR: ${{ runner.temp }}/jarvis-smoke-locked
          JARVIS_VAULT_DIR: ${{ runner.temp }}/jarvis-smoke-vault-locked
        timeout-minutes: 5
      - name: Smoke test, local brain without Roamies (unlocked) (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a release/linux-unpacked/jarvis --no-sandbox
        env:
          JARVIS_SMOKE_TEST: '1'
          JARVIS_ROAMIES_PATH: ${{ runner.temp }}/no-roamies/Roamies.app
          JARVIS_GG_DIR: ${{ runner.temp }}/gg
          JARVIS_DATA_DIR: ${{ runner.temp }}/jarvis-smoke-local
          JARVIS_VAULT_DIR: ${{ runner.temp }}/jarvis-smoke-vault-local
        timeout-minutes: 5
      - name: Smoke test, with Roamies (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a release/linux-unpacked/jarvis --no-sandbox
        env:
          JARVIS_SMOKE_TEST: '1'
          JARVIS_ROAMIES_PATH: ${{ runner.temp }}/Roamies.app
          JARVIS_GG_DIR: ${{ runner.temp }}/gg
          JARVIS_DATA_DIR: ${{ runner.temp }}/jarvis-smoke-unlocked
          JARVIS_VAULT_DIR: ${{ runner.temp }}/jarvis-smoke-vault-unlocked
        timeout-minutes: 5
      - name: Smoke test, without Roamies (locked) (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d release/mac*/Jarvis.app | head -1)
          "$APP/Contents/MacOS/Jarvis"
        env:
          JARVIS_SMOKE_TEST: '1'
          JARVIS_SMOKE_EXPECT: locked
          JARVIS_BRAIN: roamies  # the Roamies brain without Roamies installed → the lock screen
          JARVIS_ROAMIES_PATH: ${{ runner.temp }}/no-roamies/Roamies.app
          JARVIS_GG_DIR: ${{ runner.temp }}/gg
          JARVIS_DATA_DIR: ${{ runner.temp }}/jarvis-smoke-locked
          JARVIS_VAULT_DIR: ${{ runner.temp }}/jarvis-smoke-vault-locked
        timeout-minutes: 5
      - name: Smoke test, with Roamies (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(ls -d release/mac*/Jarvis.app | head -1)
          "$APP/Contents/MacOS/Jarvis"
        env:
          JARVIS_SMOKE_TEST: '1'
          JARVIS_ROAMIES_PATH: ${{ runner.temp }}/Roamies.app
          JARVIS_GG_DIR: ${{ runner.temp }}/gg
          JARVIS_DATA_DIR: ${{ runner.temp }}/jarvis-smoke-unlocked
          JARVIS_VAULT_DIR: ${{ runner.temp }}/jarvis-smoke-vault-unlocked
        timeout-minutes: 5
      - name: Smoke test, without Roamies (locked) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\Jarvis.exe" -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          exit $p.ExitCode
        env:
          JARVIS_SMOKE_TEST: '1'
          JARVIS_SMOKE_EXPECT: locked
          JARVIS_BRAIN: roamies  # the Roamies brain without Roamies installed → the lock screen
          JARVIS_ROAMIES_PATH: ${{ runner.temp }}\no-roamies\Roamies.app
          JARVIS_GG_DIR: ${{ runner.temp }}\gg
          JARVIS_DATA_DIR: ${{ runner.temp }}\jarvis-smoke-locked
          JARVIS_VAULT_DIR: ${{ runner.temp }}\jarvis-smoke-vault-locked
        timeout-minutes: 5
      - name: Smoke test, with Roamies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release\win-unpacked\Jarvis.exe" -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          exit $p.ExitCode
        env:
          JARVIS_SMOKE_TEST: '1'
          JARVIS_ROAMIES_PATH: ${{ runner.temp }}\Roamies.app
          JARVIS_GG_DIR: ${{ runner.temp }}\gg
          JARVIS_DATA_DIR: ${{ runner.temp }}\jarvis-smoke-unlocked
          JARVIS_VAULT_DIR: ${{ runner.temp }}\jarvis-smoke-vault-unlocked
        timeout-minutes: 5

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
